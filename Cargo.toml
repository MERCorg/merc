[workspace.package]
edition = "2024"
homepage = "https://mercorg.github.io/merc-website/"
repository = "https://github.com/MERCorg/merc.git"
license = "BSL-1.0"
# This version should not exceed the version supported by kani
rust-version = "1.91.0"
version = "2.0.0"

# Add debug information to the release binaries.
[profile.release]
lto = "thin"
panic = "abort"
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev]
split-debuginfo = "packed"

[workspace]
resolver = "3"
members = [
    "crates/core/aterm",
    "crates/core/aterm/benchmarks",
    "crates/core/io",
    "crates/core/collections",
    "crates/core/number",
    "crates/core/sharedmutex",
    "crates/core/sharedmutex/benchmarks",
    "crates/core/tools",
    "crates/core/unsafety",
    "crates/core/unsafety/benchmarks",
    "crates/core/utilities",
    "crates/core/utilities/benchmarks",

    "crates/rewriter/data",
    "crates/rewriter/macros",
    "crates/rewriter/rec-tests",
    "crates/rewriter/sabre_compiling",
    "crates/rewriter/sabre_compiling/sabre_ffi",
    "crates/rewriter/sabre",
    "crates/rewriter/sabre/benchmarks",

    "crates/transition_systems/explore",
    "crates/transition_systems/lts",
    "crates/transition_systems/lts/benchmarks",
    "crates/transition_systems/reduction",
    "crates/transition_systems/refinement",
    "crates/transition_systems/symbolic",
    "crates/transition_systems/symbolic/benchmarks",
    "crates/transition_systems/vpg",
    "crates/transition_systems/vpg/benchmarks",

    "crates/language/syntax",
    "crates/language/typecheck",

    "crates/xtask",
    
    "tools/lts",
    "tools/rewrite",
    "tools/sym",
    "tools/vpg",
]

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(loom)', 'cfg(kani)'] }

[workspace.dependencies]
ahash = "0.8"
bitvec = "1.1"
bumpalo = "3.20"
clap = { version = "4.6", features = ["derive"] }
# Intentionally downgraded to keep the rustc msrv.
core_affinity2 = "0.15"
dashmap = { version = "7.0.0-rc2", features = ["inline-more"] }
delegate = "0.13"
ena = "0.14"
env_logger = { version = "0.11", features = ["kv"] }
equivalent = "1.0"
hashbrown = "0.17"
html-escape = "0.2"
itertools = "0.15"
log = { version = "0.4", features = ["kv"] }
num = "0.4"
oxidd = { version = "0.13", features = ["multi-threading"] }
oxidd-dump = "0.8"
oxidd-core = "0.13"
oxidd-reorder = "0.8"
oxidd-rules-bdd = "0.13"
oxidd-rules-ldd = "0.11"
parking_lot = "0.12"
pest = "2.9"
pest_derive  = "2.9"
rand = "0.10"
rayon = "1.12"
regex = "1.13"
rustc-hash = "2.1"
smallvec = "1.16"
thiserror = "2.0"
toml = "1.1"
winapi = { version = "0.3", features = ["consoleapi", "wincon"] }

# Used for the compiling rewriter
libloading = "0.9"

# Used by the lower level crates
allocator-api2 =  "0.4"
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
loom = { version = "0.7", features = ["checkpoint"] }
mimalloc = "0.1"
quanta = "0.13"
streaming-iterator = "0.1"
thread_local = "1.1"
tikv-jemallocator = "0.7"

# Used in macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }

# Used for xtask
duct = "1.1"
glob = "0.3"
which = "8.0"

# Used in tests
indoc  = "2.0"
test-case  = "3.3"
test-log = "0.2"
trybuild = "1.0"
tempfile = "3.27"

# Used for benchmarks
criterion = "0.8"

# Used for the cadp FFI
bindgen = "0.73"
cargo-emit = "0.2"

# The workspace crates.
merc_aterm = { version = "3.0", path = "crates/core/aterm" }
merc_collections = { version = "3.0", path = "crates/core/collections" }
merc_io = { version = "3.0", path = "crates/core/io" }
merc_number = { version = "3.0", path = "crates/core/number" }
merc_sharedmutex = { version = "3.0", path = "crates/core/sharedmutex" }
merc_tools = { version = "2.0", path = "crates/core/tools" }
merc_unsafety = { version = "3.0", path = "crates/core/unsafety" }
merc_utilities = { version = "3.0", path = "crates/core/utilities" }

merc_data = { version = "3.0", path = "crates/rewriter/data" }
merc_macros = { version = "2.0", path = "crates/rewriter/macros" }
merc_rec-tests = { path = "crates/rewriter/rec-tests" }
merc_sabre = { version = "3.0", path = "crates/rewriter/sabre" }
merc_sabre-compiling = { path = "crates/rewriter/sabre_compiling" }
merc_sabre-ffi = { path = "crates/rewriter/sabre_compiling/sabre_ffi" }

merc_explore = { version = "2.0", path = "crates/transition_systems/explore" }
merc_lts = { version = "3.0", path = "crates/transition_systems/lts" }
merc_reduction = { version = "3.0", path = "crates/transition_systems/reduction" }
merc_refinement = { version = "3.0", path = "crates/transition_systems/refinement" }
merc_symbolic = { version = "3.0",path = "crates/transition_systems/symbolic", features = ["clap"] }
merc_vpg = { version = "3.0", path = "crates/transition_systems/vpg", features = ["clap"] }

merc_syntax = { version = "3.0", path = "crates/language/syntax" }
merc_typecheck = { version = "2.0", path = "crates/language/typecheck" }


# Vendored libraries
merc_pest_consume = { version = "2.1", git = "https://github.com/MERCorg/pest_consume" }

# Use a local checkout of the oxidd fork until the LDD branch is integrated.
[patch.crates-io]
oxidd = { git = "https://github.com/mlaveaux/oxidd", rev = "bb07c8cbabd2a35a6fd94a8764c503a50dd22f03" }
oxidd-core = { git = "https://github.com/mlaveaux/oxidd", rev = "bb07c8cbabd2a35a6fd94a8764c503a50dd22f03" }
oxidd-dump =  { git = "https://github.com/mlaveaux/oxidd", rev = "bb07c8cbabd2a35a6fd94a8764c503a50dd22f03" }
oxidd-reorder = { git = "https://github.com/mlaveaux/oxidd", rev = "bb07c8cbabd2a35a6fd94a8764c503a50dd22f03" }
oxidd-rules-bdd = { git = "https://github.com/mlaveaux/oxidd", rev = "bb07c8cbabd2a35a6fd94a8764c503a50dd22f03" }
oxidd-rules-ldd = { git = "https://github.com/mlaveaux/oxidd", rev = "bb07c8cbabd2a35a6fd94a8764c503a50dd22f03" }