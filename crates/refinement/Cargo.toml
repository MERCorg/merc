[package]
name = "merc_refinement"
description = "Algorithms to compare labelled transition systems with respect to various refinement relations."
keywords = ["comparison", "transition-systems"]
categories = ["algorithms", "science"]
readme = "README.md"
version = "3.0.0"

edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
clap = ["dep:clap"]
# Switches to the Aeneas-translatable shape.
lean = ["merc_lts/lean", "merc_reduction/lean"]

[dependencies]
merc_collections.workspace = true
merc_io.workspace = true
merc_lts.workspace = true
merc_reduction.workspace = true
merc_utilities.workspace = true

bitvec.workspace = true
bumpalo.workspace = true
itertools.workspace = true
log.workspace = true
rand.workspace = true
rustc-hash.workspace = true

clap = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
test-log.workspace = true