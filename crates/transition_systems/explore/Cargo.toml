[package]
name = "merc_explore"
description = "Provides state space exploration algorithms on top of a generic linear process interface"
keywords = ["process", "transition-systems", "exploration"]
categories = ["science"]
readme = "README.md"
version = "2.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
clap = ["dep:clap"]
# Tracks per-summand cache hit/miss counters for `CacheLPS`.
metrics = []

[dependencies]
merc_collections.workspace = true
merc_io.workspace = true
merc_lts.workspace = true
merc_syntax.workspace = true
merc_unsafety.workspace = true
merc_utilities.workspace = true

clap = { workspace = true, optional = true }
core_affinity2.workspace = true
crossbeam-deque.workspace = true
crossbeam-utils.workspace = true
itertools.workspace = true
log.workspace = true
quanta.workspace = true
rand.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
streaming-iterator.workspace = true

[dev-dependencies]
merc_reduction.workspace = true
tempfile.workspace = true

[lints]
workspace = true