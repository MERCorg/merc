[package]
name = "merc_sabre"
description = "Implements various term rewrite engines based on a set automaton matching construction."
keywords = ["rewriting", "term"]
categories = ["algorithms", "data-structures", "science"]
readme = "README.md"
version = "3.0.0"

edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Counts what the rewriters do, see `RewriteMetrics`.
metrics = []

[dependencies]
merc_aterm.workspace = true
merc_data.workspace = true
merc_utilities.workspace = true

rustc-hash.workspace = true
smallvec.workspace = true
html-escape.workspace = true
ahash.workspace = true
bitvec.workspace = true
env_logger.workspace = true
log.workspace = true
itertools.workspace = true
rand.workspace = true

[dev-dependencies]
# The tests compare rewriters by their metrics.
merc_sabre = { path = ".", features = ["metrics"] }
merc_syntax.workspace = true
merc_typecheck.workspace = true

test-case.workspace = true
test-log.workspace = true