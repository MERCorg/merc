# Add debug information to the release binaries.
[profile.release]
lto = "thin"
panic = "abort"
debug = "line-tables-only"
split-debuginfo= "packed"

[profile.dev]
split-debuginfo= "packed"

[workspace]
resolver = "3"
members = [
    "ltsgraph",
    "ltsgraph-lib",
    "ltsgraph-lib/benchmarks/"
]

[workspace.package]
edition = "2024"
license = "BSL-1.0"
repository = "https://github.com/MERCorg/merc.git"
rust-version = "1.95.0"
version = "1.0.0"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
cosmic-text = "0.19"
env_logger = "0.11"
# This version must be kept in sync with femtovg
femtovg = { version = "0.28", features = ["swash", "wgpu"] }
glam = "0.34"
kurbo = "0.13"
log = "0.4"
rand = "0.10"
rfd = { version = "0.18" }
slint = { version = "1.19", features = ["compat-1-2", "std", "accessibility", "backend-winit", "renderer-femtovg"], default-features = false }
slint-build = "1.19"
tiny-skia = "0.12"
tokio = { version = "1.54", features = ["rt", "macros"] }
vello = "0.12"
vello_cpu = "0.4"
wgpu = "30.0"

# Used for benchmarks
criterion = "0.8"

# The workspace libraries.
merc_ltsgraph_lib = { path = "ltsgraph-lib" }

merc_io = { path = "../../crates/core/io" }
merc_tools = { path = "../../crates/core/tools" }
merc_unsafety = { path = "../../crates/core/unsafety" }
merc_utilities = { path = "../../crates/core/utilities" }

merc_lts = { path = "../../crates/transition_systems/lts" }
