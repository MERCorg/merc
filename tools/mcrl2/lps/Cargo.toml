[package]
name = "merc-lps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "merc-lps"
path = "src/main.rs"
# Avoid a rustdoc output filename collision with the `merc_lps` library crate.
doc = false

[features]
metrics = ["merc_lps/metrics"]

[dependencies]
mcrl2 = { workspace = true, features = ["clap"] }
merc_explore = { workspace = true, features = ["clap"] }
merc_lps = { workspace = true, features = ["clap"] }
merc_lts = { workspace = true, features = ["clap"] }
merc_symbolic = { workspace = true, features = ["clap"] }
merc_tools.workspace = true
merc_unsafety.workspace = true
merc_utilities.workspace = true
oxidd.workspace = true

clap.workspace = true
env_logger.workspace = true
log.workspace = true

# The compiling rewriter is only supported on unix platforms, so it is enabled by default on those.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
mcrl2 = { workspace = true, features = ["jittyc"] }
