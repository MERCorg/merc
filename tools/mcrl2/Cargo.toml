[workspace.package]
edition = "2024"
license = "BSL-1.0"
rust-version = "1.91.0"
version = "1.0.0"

# Add debug information to the release binaries.
[profile.release]
lto = "thin"
panic = "abort"
debug = "line-tables-only"

[workspace]
resolver = "3"
members = [
    "crates/mcrl2",
    "crates/mcrl2-macros",
    "crates/merc_lps",
    "crates/merc_pbes",
    "crates/xtask",
    "lps",
    "pbes",
]
exclude = [
    "crates/mCRL2-sys",
]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
env_logger = { version = "0.11", features = ["kv"] }
itertools = "0.15"
log = { version = "0.4", features = ["kv"] }
parking_lot = "0.12"
petgraph = "0.8"
rand = "0.10"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.27"
test-case = "3"

# Dependencies used in procedural macros.
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }

# Dependencies used in xtask
duct = "1.1"
which = "8.0"

# The workspace libraries.
mcrl2 = { path = "crates/mcrl2" }
mcrl2-macros = { path = "crates/mcrl2-macros" }
mcrl2-sys = { git = "https://github.com/MERCorg/mCRL2-sys", rev = "e337b2dc8243844f8b40cf2c632417b3ec58c421" }
merc_lps = { path = "crates/merc_lps" }
merc_pbes = { path = "crates/merc_pbes" }

merc_aterm = { path = "../../crates/core/aterm" }
merc_collections = { path = "../../crates/core/collections" }
merc_io = { path = "../../crates/core/io" }
merc_tools = { path = "../../crates/core/tools" }
merc_unsafety = { path = "../../crates/core/unsafety" }
merc_utilities = { path = "../../crates/core/utilities" }

merc_data = { path = "../../crates/rewriter/data" }

merc_explore = { path = "../../crates/transition_systems/explore", features = ["clap"] }
merc_lts = { path = "../../crates/transition_systems/lts", features = ["clap"] }
merc_reduction = { path = "../../crates/transition_systems/reduction" }
merc_symbolic = { path = "../../crates/transition_systems/symbolic", features = ["clap"] }
merc_vpg = { path = "../../crates/transition_systems/vpg" }

merc_typecheck = { path = "../../crates/language/typecheck" }
merc_syntax = { path = "../../crates/language/syntax" }

oxidd = { version = "0.13", features = ["multi-threading"] }

# [patch."https://github.com/MERCorg/mCRL2-sys"]
# mcrl2-sys = { path = "crates/mCRL2-sys" }

[patch.crates-io]
oxidd = { git = "https://github.com/mlaveaux/oxidd", rev = "bb07c8cbabd2a35a6fd94a8764c503a50dd22f03" }
oxidd-core = { git = "https://github.com/mlaveaux/oxidd", rev = "bb07c8cbabd2a35a6fd94a8764c503a50dd22f03" }
oxidd-dump = { git = "https://github.com/mlaveaux/oxidd", rev = "bb07c8cbabd2a35a6fd94a8764c503a50dd22f03" }
oxidd-reorder = { git = "https://github.com/mlaveaux/oxidd", rev = "bb07c8cbabd2a35a6fd94a8764c503a50dd22f03" }
oxidd-rules-bdd = { git = "https://github.com/mlaveaux/oxidd", rev = "bb07c8cbabd2a35a6fd94a8764c503a50dd22f03" }
oxidd-rules-ldd = { git = "https://github.com/mlaveaux/oxidd", rev = "bb07c8cbabd2a35a6fd94a8764c503a50dd22f03" }