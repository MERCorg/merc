[package]
name = "merc-vpg"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "merc-vpg"
path = "src/main.rs"
# Avoid a rustdoc output filename collision with the `merc_vpg` library crate.
doc = false

[features]
# If we enable measurements also the oxidd measurements are enabled.
merc_metrics = ["oxidd/statistics"]

[dependencies]
merc_lts = { workspace = true, features = ["clap"] }
merc_symbolic.workspace = true
merc_syntax.workspace = true
merc_tools.workspace = true
merc_unsafety.workspace = true
merc_utilities.workspace = true
merc_vpg = { workspace = true, features = ["clap"] }

clap.workspace = true
duct.workspace = true
env_logger.workspace = true
itertools.workspace = true
log.workspace = true
oxidd.workspace = true
which.workspace = true

[lints]
workspace = true