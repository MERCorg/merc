[package]
name = "merc-lts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "merc-lts"
path = "src/main.rs"
# Avoid a rustdoc output filename collision with the `merc_lts` library crate.
doc = false

[features]
# Builds this binary against the Aeneas-translatable shape of `merc_lts`'s
# `LTS` trait, so the Lean-verified algorithms can actually be exercised in
# practice. Not on by default (see `merc_reduction`'s `lean` feature).
lean = ["merc_lts/lean", "merc_reduction/lean", "merc_refinement/lean"]

[dependencies]
merc_collections.workspace = true
merc_data.workspace = true
merc_explore.workspace = true
merc_io.workspace = true
merc_lts = { workspace = true, features = ["clap"] }
merc_reduction = { workspace = true, features = ["clap"] }
merc_refinement = { workspace = true, features = ["clap"] }
merc_syntax.workspace = true
merc_tools.workspace = true
merc_unsafety.workspace = true
merc_utilities.workspace = true

clap.workspace = true
env_logger.workspace = true
log.workspace = true