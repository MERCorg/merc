name: Nightly Build

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: on

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:      
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:        
    - name: Cache APT packages
      if: matrix.os == 'ubuntu-latest'
      uses: actions/cache@v6
      with:
        path: /var/cache/apt/archives/*.deb
        key: apt-${{ runner.os }}-fontconfig-freetype-v1

    - name: Install Ubuntu Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libfreetype6-dev

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11    

    - name: Install stable rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install nextest
      uses: taiki-e/install-action@nextest

    - name: Checkout the repository
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Build Release
      run: cargo build --release
      env:        
        RUSTC_WRAPPER: sccache

    - name: Run tests
      run: cargo nextest run --release --no-fail-fast -- --include-ignored
      env:
        RUST_BACKTRACE: full
        RUST_LOG: debug
        RUSTC_WRAPPER: sccache
        RUST_MIN_STACK: 104857600

    - name: Build tools/mcrl2 Release
      run: cargo build --release
      working-directory: tools/mcrl2
      env:        
        RUSTC_WRAPPER: sccache

    - name: Run tools/mcrl2 tests
      run: cargo nextest run --release --no-fail-fast -- --include-ignored
      working-directory: tools/mcrl2
      env:
        RUST_BACKTRACE: full
        RUST_LOG: debug
        RUSTC_WRAPPER: sccache
        RUST_MIN_STACK: 104857600

    - name: Build tools/gui Release
      run: cargo build --release
      working-directory: tools/gui
      env:        
        RUSTC_WRAPPER: sccache
        
    - name: Run tools/gui tests
      run: cargo nextest run --release --no-fail-fast -- --include-ignored
      working-directory: tools/gui
      env:
        RUST_BACKTRACE: full
        RUST_LOG: debug
        RUSTC_WRAPPER: sccache
        RUST_MIN_STACK: 104857600