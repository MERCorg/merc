name: Cargo Clippy

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: on

jobs:
  clippy:
    runs-on: ubuntu-latest

    steps:    
    - name: Cache APT packages
      uses: actions/cache@v6
      with:
        path: /var/cache/apt/archives/*.deb
        key: apt-${{ runner.os }}-llvm-fontconfig-freetype-v1

    - name: Install Ubuntu Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm libfontconfig1-dev libfreetype6-dev

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - uses: actions/checkout@v7
      with:
        submodules: true

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Run cargo clippy
      uses: auguwu/clippy-action@1.5.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Run cargo clippy for GUI tools
      uses: auguwu/clippy-action@1.5.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        working-directory: tools/gui
        
    - name: Run cargo clippy for mCRL2 tools
      uses: auguwu/clippy-action@1.5.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        working-directory: tools/mcrl2/