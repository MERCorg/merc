name: Test Miri

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: on

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:      
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:    
    - name: Cache APT packages
      if: matrix.os == 'ubuntu-latest'
      uses: actions/cache@v6
      with:
        path: /var/cache/apt/archives/*.deb
        key: apt-${{ runner.os }}-fontconfig-freetype-v1

    - name: Install Ubuntu Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libfreetype6-dev

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Install nightly rust
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rust-src, miri
      
    - name: Install nextest
      uses: taiki-e/install-action@nextest

    - name: Checkout the repository
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Run tests
      # merc_macros is a proc-macro crate: its tests always run natively outside Miri.
      run: cargo +nightly miri nextest run --no-fail-fast --workspace --exclude merc_macros
      env:
        RUST_BACKTRACE: full
        RUST_LOG: debug
        RUSTC_WRAPPER: sccache
        MIRIFLAGS: -Zmiri-disable-isolation --cfg chacha20_force_soft
