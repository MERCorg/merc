name: Verify with Kani

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  kani:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Run Kani on merc_unsafety
      uses: model-checking/kani-github-action@v1
      with:
        working-directory: crates/unsafety
        requested_version: 0.68.0

    - name: Run Kani on merc_number
      uses: model-checking/kani-github-action@v1
      with:
        working-directory: crates/number
        requested_version: 0.68.0
