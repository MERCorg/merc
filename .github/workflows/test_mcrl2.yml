name: Test with MCRL2_PATH

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: on

jobs:
  test:
    runs-on: ubuntu-latest

    steps:    
    - name: Cache APT packages
      uses: actions/cache@v5
      with:
        path: /var/cache/apt/archives/*.deb
        key: apt-${{ runner.os }}-mcrl2-build-deps-v1

    - name: Install Ubuntu Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git libboost-dev libfontconfig1-dev libfreetype6-dev

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Install stable rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install nextest
      uses: taiki-e/install-action@nextest
      
    - name: Checkout the repository
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Checkout mCRL2
      uses: actions/checkout@v7
      with:
        repository: mCRL2org/mCRL2
        ref: 4e62c71e1f622e663ed466378f76c7d5ed4f398a
        path: mCRL2
        submodules: true

    - name: Build mCRL2 toolset
      run: cmake -S mCRL2 -B mCRL2/build -DMCRL2_ENABLE_EXPERIMENTAL=ON -DMCRL2_ENABLE_GUI_TOOLS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache && cmake --build mCRL2/build --config Release

    - name: Run mCRL2 specific tests
      run: cargo nextest run --no-fail-fast -- --include-ignored mcrl2
      env:
        RUST_BACKTRACE: full
        RUST_LOG: debug
        RUSTC_WRAPPER: sccache
        MCRL2_PATH: ${{ github.workspace }}/mCRL2/build/stage/bin
        
    - name: Run mCRL2 specific tests in tools/mcrl2
      run: cargo nextest run --no-fail-fast -- --include-ignored mcrl2
      working-directory: tools/mcrl2
      env:
        RUST_BACKTRACE: full
        RUST_LOG: debug
        RUSTC_WRAPPER: sccache
        MCRL2_PATH: ${{ github.workspace }}/mCRL2/build/stage/bin