name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: on

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The binaries require the glibc version of the build system, so build on the oldest
          # supported distribution instead of ubuntu-latest. Keep it in sync with install-deb.
          - os: ubuntu-24.04
            installers: --installer deb --installer rpm
          - os: macos-latest
            installers: --installer dmg
          - os: windows-latest
            installers: --installer msi
    runs-on: ${{ matrix.os }}

    steps:
    - name: Cache APT packages
      if: matrix.os == 'ubuntu-24.04'
      uses: actions/cache@v6
      with:
        path: /var/cache/apt/archives/*.deb
        key: apt-${{ runner.os }}-fontconfig-freetype-v1

    - name: Install Ubuntu Dependencies
      if: matrix.os == 'ubuntu-24.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libfreetype6-dev

    # WiX v7 and later require accepting the OSMF EULA (https://github.com/wixtoolset/wix/blob/main/OSMFEULA.txt).
    - name: Install WiX toolset
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        dotnet tool install --global wix --version 7.0.1
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Install WiX UI extension
      if: matrix.os == 'windows-latest'
      shell: bash
      run: wix extension add -g WixToolset.UI.wixext/7.0.1

    - name: Accept WiX OSMF EULA
      if: matrix.os == 'windows-latest'
      run: wix eula accept wix7

    - name: Install stable rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Checkout the repository
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Run package task
      run: cargo xtask package ${{ matrix.installers }}
      env:        
        # sccache does not fall back to an @argfile, and the GUI rustc command line exceeds the Windows limit (os error 206).
        RUSTC_WRAPPER: ${{ matrix.os != 'windows-latest' && 'sccache' || '' }}

    - name: Upload portable artifact
      uses: actions/upload-artifact@v7
      with:
        name: portable-${{ matrix.os }}
        path: package
        if-no-files-found: warn

    - name: Upload installer artifact
      uses: actions/upload-artifact@v7
      with:
        name: installer-${{ matrix.os }}
        path: |
          installers
          !installers/*.wxs
        if-no-files-found: error

    - name: Run tool tests
      run: cargo xtask test-tools package/
      env:
        RUSTC_WRAPPER: sccache

    # Used to run the tool tests on clean systems in the install-* jobs below.
    - name: Upload xtask artifact
      uses: actions/upload-artifact@v7
      with:
        name: xtask-${{ matrix.os }}
        path: |
          target/debug/xtask
          target/debug/xtask.exe
        if-no-files-found: error

  # The install-* jobs install the packages on a clean system and run the tool tests on the
  # installed tools, the xtask binary is downloaded such that no toolchain has to be installed.
  install-deb:
    needs: test
    runs-on: ubuntu-24.04
    container: ubuntu:24.04

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7

    - name: Download installer artifact
      uses: actions/download-artifact@v8
      with:
        name: installer-ubuntu-24.04
        path: installers

    - name: Download xtask artifact
      uses: actions/download-artifact@v8
      with:
        name: xtask-ubuntu-24.04
        path: xtask

    - name: Install package
      run: |
        apt-get update
        apt-get install -y ./installers/merc_*.deb

    - name: Run tool tests
      run: |
        chmod +x xtask/xtask
        xtask/xtask test-tools

    - name: Remove package
      run: |
        apt-get remove -y merc
        test ! -e /usr/bin/merc-lts

  install-rpm:
    needs: test
    runs-on: ubuntu-24.04
    container: fedora:latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7

    - name: Download installer artifact
      uses: actions/download-artifact@v8
      with:
        name: installer-ubuntu-24.04
        path: installers

    - name: Download xtask artifact
      uses: actions/download-artifact@v8
      with:
        name: xtask-ubuntu-24.04
        path: xtask

    - name: Install package
      run: dnf install -y ./installers/merc-*.rpm

    - name: Run tool tests
      run: |
        chmod +x xtask/xtask
        xtask/xtask test-tools

    - name: Remove package
      run: |
        dnf remove -y merc
        test ! -e /usr/bin/merc-lts

  install-dmg:
    needs: test
    runs-on: macos-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7

    - name: Download installer artifact
      uses: actions/download-artifact@v8
      with:
        name: installer-macos-latest
        path: installers

    - name: Download xtask artifact
      uses: actions/download-artifact@v8
      with:
        name: xtask-macos-latest
        path: xtask

    - name: Run tool tests on the disk image
      run: |
        chmod +x xtask/xtask
        hdiutil attach -nobrowse -readonly -mountpoint /Volumes/merc installers/merc-*.dmg
        xtask/xtask test-tools /Volumes/merc --examples examples
        hdiutil detach /Volumes/merc

  install-msi:
    needs: test
    runs-on: windows-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7

    - name: Download installer artifact
      uses: actions/download-artifact@v8
      with:
        name: installer-windows-latest
        path: installers

    - name: Download xtask artifact
      uses: actions/download-artifact@v8
      with:
        name: xtask-windows-latest
        path: xtask

    - name: Install package
      shell: pwsh
      run: |
        $msi = (Get-ChildItem installers/merc-*.msi).FullName
        $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log'
        if ($process.ExitCode -ne 0) {
          Get-Content install.log -Tail 50
          exit $process.ExitCode
        }

    # Changes to the system PATH are not picked up by later steps, so forward the entries that
    # the installer added. The tool tests then only find the tools when the PATH was updated.
    - name: Forward system PATH
      shell: pwsh
      run: |
        $current = $env:PATH.Split(';')
        [Environment]::GetEnvironmentVariable('PATH', 'Machine').Split(';') |
          Where-Object { $_ -and $current -notcontains $_ } |
          Add-Content -Path $env:GITHUB_PATH

    - name: Run tool tests
      run: xtask/xtask.exe test-tools

    - name: Uninstall package
      shell: pwsh
      run: |
        $msi = (Get-ChildItem installers/merc-*.msi).FullName
        $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/x', "`"$msi`"", '/qn'
        if ($process.ExitCode -ne 0) { exit $process.ExitCode }
        if (Test-Path 'HKLM:\Software\merc') { throw 'Registry key was not removed' }
