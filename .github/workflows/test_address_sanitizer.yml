name: Test Address Sanitizer

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: on

jobs:
  test:
    runs-on: ubuntu-latest

    steps:    
    - name: Cache APT packages
      uses: actions/cache@v5
      with:
        path: /var/cache/apt/archives/*.deb
        key: apt-${{ runner.os }}-llvm-fontconfig-freetype-v1

    - name: Install Ubuntu Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm libfontconfig1-dev libfreetype6-dev

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      
    - name: Install nightly rust
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rust-src
        
    - name: Install nextest
      uses: taiki-e/install-action@nextest   

    - name: Checkout the repository
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Run tests
      run: cargo +nightly xtask address-sanitizer test --no-fail-fast
      env:
        RUST_BACKTRACE: full
        RUST_LOG: debug
        RUSTC_WRAPPER: sccache
        
    - name: Run tools/mcrl2 tests
      run: cargo +nightly xtask address-sanitizer test --no-fail-fast
      working-directory: tools/mcrl2
      env:
        RUST_BACKTRACE: full
        RUST_LOG: debug
        RUSTC_WRAPPER: sccache
