name: Deploy Documentation to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Runs on pull requests
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
  
env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: on

jobs:
  build:      
    runs-on: ubuntu-latest
    
    steps:
      - name: Cache APT packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-doc-build-deps-v1

      - name: Install Ubuntu Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git grcov libboost-dev libfontconfig1-dev libfreetype6-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        
      # Nightly is only needed for the coverage instrumentation, everything
      # that treats warnings as errors is run with the stable toolchain.
      - name: Install nightly rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install stable rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM Tools for Rust
        run: rustup component add --toolchain nightly llvm-tools-preview
  
      - name: Install grcov
        run: cargo install grcov
        
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Run doc tests
        run: cargo test --doc
        env:
          RUSTC_WRAPPER: sccache

      - name: Run tools/mcrl2 doc tests
        run: cargo test --doc
        env:
          working-directory: tools/mcrl2
          RUSTC_WRAPPER: sccache

      - name: Run tools/gui doc tests
        run: cargo test --doc
        env:
          working-directory: tools/gui
          RUSTC_WRAPPER: sccache

      - name: Generating Code Coverage
        run: cargo +nightly xtask coverage nextest run
        env:
          RUSTC_WRAPPER: sccache

      # Documentation is built with stable since RUSTDOCFLAGS denies warnings,
      # and we do not want new nightly (deprecation) lints to break the build.
      - name: Build Documentation
        run: |
          cargo +stable doc --no-deps --document-private-items
          cargo +stable doc --no-deps --document-private-items --manifest-path tools/mcrl2/Cargo.toml
          cargo +stable doc --no-deps --document-private-items --manifest-path tools/gui/Cargo.toml
          cp -r target/coverage/html target/doc/coverage/
          echo "<meta http-equiv=\"refresh\" content=\"0; url=merc_aterm\">" > target/doc/index.html
        env:
          RUSTC_WRAPPER: sccache
          RUSTDOCFLAGS: "-D warnings"
          MCRL2_PATH: ${{ github.workspace }}/mCRL2/build/stage/bin

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the documentation directory
          path: 'target/doc/'

  deploy:
    # Only deploy if we're on the main branch and the build job succeeded
    if: github.repository == 'MERCorg/merc' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5