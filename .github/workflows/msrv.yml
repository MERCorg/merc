name: Minimal Supported Rust Version

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: on


jobs:
  test:
    strategy:
      fail-fast: false
      matrix:      
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Cache APT packages
      if: matrix.os == 'ubuntu-latest'
      uses: actions/cache@v5
      with:
        path: /var/cache/apt/archives/*.deb
        key: apt-${{ runner.os }}-fontconfig-freetype-v1

    - name: Install Ubuntu Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libfreetype6-dev
      
    - name: Install stable rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Checkout the repository
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install cargo msrv
      run: cargo install cargo-msrv --locked

    - name: Test MSRV
      run: cargo msrv verify --rust-version 1.91.0
      env:        
        RUSTC_WRAPPER: sccache

    - name: Test tools/mcrl2 MSRV
      run: cargo msrv verify --rust-version 1.91.0
      env:        
        RUSTC_WRAPPER: sccache        
      working-directory: tools/mcrl2

    - name: Test tools/gui MSRV
      run: cargo msrv verify --rust-version 1.92.0
      env:        
        RUSTC_WRAPPER: sccache        
      working-directory: tools/gui